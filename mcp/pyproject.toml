[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinpod-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for KinPod Universal AI Companion Hardware"
readme = "README.md"
authors = [{ name = "KinPod Community" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0"
]

[project.scripts]
kinpod-mcp = "kinpod_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["kinpod_mcp"]
